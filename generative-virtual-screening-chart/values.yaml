# Default values for generative-virtual-screening-chart.

replicaCount: 1

msa:
  containerName: msa
  containerPort: 8000
  repository: nvcr.io/nim/colabfold/msa-search
  tag: "1.0"
  pullPolicy: Always
  cacheFolder: /opt/nim/.cache
  servicePort: 8081

openfold2:
  containerName: openfold2
  containerPort: 8000
  repository: nvcr.io/nim/openfold/openfold2
  tag: "1.0"
  pullPolicy: Always
  cacheFolder: /opt/nim/.cache
  servicePort: 8082

genmol:
  containerName: genoml
  containerPort: 8000
  repository: nvcr.io/nim/nvidia/genmol
  tag: "1.0"
  pullPolicy: Always
  cacheFolder: /opt/nim/.cache
  servicePort: 8083

diffdock:
  containerName: diffdock
  containerPort: 8000
  tritonPort: 8003
  repository: nvcr.io/nim/mit/diffdock
  tag: "2.0"
  pullPolicy: Always
  cacheFolder: /opt/nim/.cache
  servicePort: 8084

imagePullSecret:
  registry: "nvcr.io"
  name: "ngc-secret-docker-registry"
  create: true
  username: '$oauthtoken'
  secretName: ngc-registry-secret
  secretKey: NGC_REGISTRY_KEY

# apiSecret:
#   name: "ngc-secret-gvs-api"
#   secretName: ngc-api-secret
#   secretKey: NGC_API_KEY

service:
  type: ClusterIP

nameOverride: ""
fullnameOverride: ""

# serviceAccount:
#   # Specifies whether a service account should be created
#   create: true
#   # Annotations to add to the service account
#   annotations: {}
#   # The name of the service account to use.
#   # If not set and create is true, a name is generated using the fullname template
#   name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    nvidia.com/gpu: 1
  requests:
    nvidia.com/gpu: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

persistence:
  # Volume type configuration - choose the appropriate storage type for your environment
  volume:
    type: "hostPath"  # Options: "pvc", "hostPath", "emptyDir"
    
    # PVC configuration (when type=pvc)
    # Use for production environments with dynamic provisioning
    pvc:
      existingClaim: ""
      storageClass: standard
      accessMode: ReadWriteMany
      size: 1.5Ti
    
    # HostPath configuration (when type=hostPath) 
    # Use for development/single-node setups - preserves cache across pod restarts
    hostPath:
      path: /data/nim
      type: DirectoryOrCreate
    
    # EmptyDir configuration (when type=emptyDir)
    # WARNING: Cache will be lost on pod restart, causing long model re-download times
    emptyDir:
      sizeLimit: ""  # Leave empty for no limit (uses available node storage)
      medium: ""     # Use "Memory" for tmpfs (RAM-based storage)
  
  # Legacy configuration (deprecated, use volume.type instead)
  existingClaim: ""
  storageClass: standard
  accessMode: ReadWriteMany
  hostPath: /data/nim
  size: 1.5Ti

nodeSelector: {}

tolerations: []

affinity: {}

# ---------------------------------------------------------------------------
# OpenShift support (disabled by default — zero impact on vanilla Kubernetes)
# ---------------------------------------------------------------------------
openshift:
  enabled: false

  routes:
    msa:
      enabled: false
      host: ""
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    openfold2:
      enabled: false
      host: ""
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    genmol:
      enabled: false
      host: ""
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
    diffdock:
      enabled: false
      host: ""
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  # Creates a custom SCC for pods that need elevated privileges.
  # The MSA init container requires runAsUser: 0 for volume permissions,
  # which is blocked by OpenShift's default restricted SCC.
  scc:
    create: false
    priority: 10

# ---------------------------------------------------------------------------
# NGC API secret used by the NIM Operator for model downloads.
# Must contain a key named NGC_API_KEY.
# ---------------------------------------------------------------------------
ngcApiSecret:
  name: "ngc-api"

# ---------------------------------------------------------------------------
# NIM Operator integration (disabled by default).
# When enabled AND the NIM Operator CRD is present on the cluster, NIMCache +
# NIMService resources are created instead of raw Deployments.
# Set replicaCount: 0 in your overlay to disable the standard Deployments.
# ---------------------------------------------------------------------------
nimOperator:
  msa-search:
    enabled: false
    replicas: 1
    service:
      name: "msa-search"
    image:
      repository: nvcr.io/nim/colabfold/msa-search
      tag: "1.0"
      pullPolicy: Always
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
    storage:
      pvc:
        create: true
        size: "1500Gi"
        volumeAccessMode: ReadWriteOnce
        storageClass: ""
    nodeSelector: {}
    tolerations: []
    env:
      - name: NIM_HTTP_API_PORT
        value: "8000"
      - name: NIM_CACHE_PATH
        value: "/opt/nim/.cache"
      - name: NIM_GLOBAL_MAX_MSA_SEQUENCES
        value: "100"
      - name: NIM_DISABLE_GPU_SERVER
        value: "True"
      - name: TOKENIZERS_PARALLELISM
        value: "false"
    expose:
      service:
        name: http
        type: ClusterIP
        port: 8000
    startupProbe:
      enabled: true
      probe:
        httpGet:
          path: /v1/health/ready
          port: 8000
        initialDelaySeconds: 300
        periodSeconds: 10
        failureThreshold: 1410

  openfold2:
    enabled: false
    replicas: 1
    service:
      name: "openfold2"
    image:
      repository: nvcr.io/nim/openfold/openfold2
      tag: "1.0"
      pullPolicy: Always
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
    storage:
      pvc:
        create: true
        size: "500Gi"
        volumeAccessMode: ReadWriteOnce
        storageClass: ""
    nodeSelector: {}
    tolerations: []
    env:
      - name: NIM_HTTP_API_PORT
        value: "8000"
      - name: NIM_CACHE_EXTERNAL
        value: "/opt/nim/.cache"
      - name: TOKENIZERS_PARALLELISM
        value: "false"
    expose:
      service:
        name: http
        type: ClusterIP
        port: 8000
    startupProbe:
      enabled: true
      probe:
        httpGet:
          path: /v1/health/ready
          port: 8000
        initialDelaySeconds: 300
        periodSeconds: 10
        failureThreshold: 330

  genmol:
    enabled: false
    replicas: 1
    service:
      name: "genmol"
    image:
      repository: nvcr.io/nim/nvidia/genmol
      tag: "1.0"
      pullPolicy: Always
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
    storage:
      pvc:
        create: true
        size: "100Gi"
        volumeAccessMode: ReadWriteOnce
        storageClass: ""
    nodeSelector: {}
    tolerations: []
    env:
      - name: NIM_HTTP_API_PORT
        value: "8000"
      - name: NIM_CACHE_PATH
        value: "/opt/nim/.cache"
      - name: TOKENIZERS_PARALLELISM
        value: "false"
    expose:
      service:
        name: http
        type: ClusterIP
        port: 8000
    startupProbe:
      enabled: true
      probe:
        httpGet:
          path: /v1/health/ready
          port: 8000
        initialDelaySeconds: 300
        periodSeconds: 10
        failureThreshold: 150

  diffdock:
    enabled: false
    replicas: 1
    service:
      name: "diffdock"
    image:
      repository: nvcr.io/nim/mit/diffdock
      tag: "2.0"
      pullPolicy: Always
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
    storage:
      pvc:
        create: true
        size: "100Gi"
        volumeAccessMode: ReadWriteOnce
        storageClass: ""
    nodeSelector: {}
    tolerations: []
    env:
      - name: NIM_HTTP_API_PORT
        value: "8000"
      - name: NIM_CACHE_PATH
        value: "/opt/nim/.cache"
      - name: DD_USE_BF16
        value: "1"
      - name: TOKENIZERS_PARALLELISM
        value: "false"
    expose:
      service:
        name: http
        type: ClusterIP
        port: 8000
    startupProbe:
      enabled: true
      probe:
        httpGet:
          path: /v1/health/ready
          port: 8000
        initialDelaySeconds: 300
        periodSeconds: 10
        failureThreshold: 240

